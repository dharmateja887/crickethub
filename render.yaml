services:
  - type: web
    name: crickethub
    runtime: python
    plan: free
    autoDeploy: true
    healthCheckPath: /
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    startCommand: "gunicorn CricketZone.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: crickethub-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        value: "rzp_test_Tb8ZRcMvs91lFe"
      - key: RAZORPAY_KEY_SECRET
        value: "SyIA4l3wGVBaaaQL3cDA0bDy"
databases:
  - name: crickethub-db
    plan: free
    databaseName: crickethub
    user: crickethub
    region: oregon